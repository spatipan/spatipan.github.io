<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Digital business card - Patipan Sitthiprawiat, MD">
    <meta name="theme-color" content="#1e293b">

    <!-- Apple Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Open Graph -->
    <meta property="og:title" content="Patipan Sitthiprawiat, MD - Digital Namecard">
    <meta property="og:description" content="Emergency Physician & AI Researcher">
    <meta property="og:type" content="profile">

    <title>Patipan Sitthiprawiat - Digital Namecard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/namecard.css">
</head>
<body>
    <!-- Loading State -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <!-- Main Card Container -->
    <div id="app" class="app-container" style="display: none;">
        <!-- Namecard -->
        <div class="namecard">
            <!-- Header Section -->
            <div class="card-header">
                <div class="profile-section">
                    <div class="profile-photo-container" id="photoContainer">
                        <!-- Photo loaded dynamically -->
                    </div>
                    <div class="profile-info">
                        <h1 id="name" class="name"></h1>
                        <p id="title" class="title"></p>
                        <p id="subtitle" class="subtitle"></p>
                        <p id="organization" class="organization"></p>
                    </div>
                </div>
                <p id="tagline" class="tagline"></p>
            </div>

            <!-- Contact Actions -->
            <div class="contact-actions">
                <a id="phoneBtn" class="action-btn" href="">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                    Call
                </a>
                <a id="emailBtn" class="action-btn" href="">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    Email
                </a>
                <a id="locationBtn" class="action-btn" href="">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    Location
                </a>
                <a id="websiteBtn" class="action-btn" href="" target="_blank">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    Website
                </a>
            </div>

            <!-- Social Links -->
            <div id="socialLinks" class="social-links">
                <!-- Loaded dynamically -->
            </div>

            <!-- Featured Projects -->
            <div id="projectsSection" class="section">
                <h2 class="section-title">Featured Projects</h2>
                <div id="projectsList" class="projects-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- Skills -->
            <div id="skillsSection" class="section">
                <h2 class="section-title">Expertise</h2>
                <div id="skillsList" class="skills-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- QR Code Section for Website -->
            <div id="websiteQrSection" class="qr-section">
                <h2 class="section-title">Visit My Website</h2>
                <div id="websiteQrcode" class="qr-code"></div>
                <p class="qr-hint">Scan to visit spatipan.github.io</p>
            </div>

            <!-- QR Code Section for vCard -->
            <div id="qrSection" class="qr-section">
                <h2 class="section-title">Scan to Save Contact</h2>
                <div id="qrcode" class="qr-code"></div>
                <p class="qr-hint">Scan with your phone camera</p>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="downloadVCF" class="primary-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download Contact Card
                </button>

                <!-- Disabled: Add to Apple Wallet
                <button id="addToWallet" class="secondary-btn apple-wallet-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21.5 8.5V17c0 1.38-1.12 2.5-2.5 2.5H5c-1.38 0-2.5-1.12-2.5-2.5V8.5h19zM21.5 5v1.5h-19V5c0-1.38 1.12-2.5 2.5-2.5h14c1.38 0 2.5 1.12 2.5 2.5z"/>
                    </svg>
                    Add to Apple Wallet
                </button>
                -->

                <button id="shareBtn" class="secondary-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                    Share
                </button>

                <a id="viewFullCV" href="cv.html" class="secondary-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    View Full CV
                </a>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Last updated: <span id="lastUpdated"></span></p>
            <p>Powered by <a href="https://github.com/spatipan/spatipan.github.io" target="_blank">GitHub Pages</a></p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="assets/js/config-loader.js"></script>
    <script src="assets/js/vcf-generator.js"></script>
    <script src="assets/js/qr-generator.js"></script>
    <script src="assets/js/wallet-integration.js"></script>
    <script>
        // Main App Initialization
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Load configuration
                const config = await loadConfig();

                // Populate card
                populateCard(config);

                // Initialize features
                initializeQRCode(config);
                initializeWebsiteQRCode(config);
                initializeButtons(config);

                // Hide loading, show app
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';

            } catch (error) {
                console.error('Failed to initialize app:', error);
                document.getElementById('loading').innerHTML = '<p>Failed to load namecard. Please refresh the page.</p>';
            }
        });

        function populateCard(config) {
            // Personal info
            document.getElementById('name').textContent = config.personal.name;
            document.getElementById('title').textContent = config.personal.title;
            document.getElementById('subtitle').textContent = config.personal.subtitle;
            document.getElementById('organization').textContent = config.personal.organization;
            document.getElementById('tagline').textContent = config.personal.tagline;

            // Profile photo
            if (config.card.showPhoto && config.personal.photo) {
                const photoContainer = document.getElementById('photoContainer');
                const img = document.createElement('img');
                img.src = config.personal.photo;
                img.alt = config.personal.name;
                img.className = 'profile-photo';
                img.onerror = () => {
                    // Fallback to initials
                    const initials = config.personal.name.split(' ').map(n => n[0]).join('');
                    photoContainer.innerHTML = `<div class="profile-initials">${initials}</div>`;
                };
                photoContainer.appendChild(img);
            } else {
                // Show initials
                const initials = config.personal.name.split(' ').map(n => n[0]).join('');
                document.getElementById('photoContainer').innerHTML = `<div class="profile-initials">${initials}</div>`;
            }

            // Contact actions
            document.getElementById('phoneBtn').href = `tel:${config.contact.phone}`;
            document.getElementById('emailBtn').href = `mailto:${config.contact.email}`;
            document.getElementById('locationBtn').href = `https://maps.google.com/?q=${encodeURIComponent(config.contact.location)}`;
            document.getElementById('websiteBtn').href = config.contact.website;

            // Social links
            const socialContainer = document.getElementById('socialLinks');
            const socials = [];
            if (config.social.github) socials.push({ name: 'GitHub', url: `https://github.com/${config.social.github}`, icon: 'github' });
            if (config.social.linkedin) socials.push({ name: 'LinkedIn', url: `https://linkedin.com/in/${config.social.linkedin}`, icon: 'linkedin' });
            if (config.social.twitter) socials.push({ name: 'Twitter', url: `https://twitter.com/${config.social.twitter}`, icon: 'twitter' });
            if (config.social.orcid) socials.push({ name: 'ORCID', url: `https://orcid.org/${config.social.orcid}`, icon: 'orcid' });
            if (config.social.researchgate) socials.push({ name: 'ResearchGate', url: `https://www.researchgate.net/profile/${config.social.researchgate}`, icon: 'researchgate' });

            socialContainer.innerHTML = socials.map(social => `
                <a href="${social.url}" target="_blank" class="social-link" title="${social.name}">
                    <span class="social-icon">${getSocialIcon(social.icon)}</span>
                    ${social.name}
                </a>
            `).join('');

            // Projects
            if (config.card.showProjects && config.projects) {
                const projectsList = document.getElementById('projectsList');
                const maxProjects = config.card.maxProjects || 3;
                projectsList.innerHTML = config.projects.slice(0, maxProjects).map(project => `
                    <div class="project-card">
                        <h3 class="project-name">${project.name}</h3>
                        <p class="project-desc">${project.description}</p>
                        ${project.tags ? `<div class="project-tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
                        <div style="display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap;">
                            ${project.url && project.url !== '#' ? `<a href="${project.url}" target="_blank" class="project-link">Learn more →</a>` : ''}
                            ${project.demo ? `<a href="${project.demo}" target="_blank" class="project-link" style="background: #059669;">Try Demo →</a>` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                document.getElementById('projectsSection').style.display = 'none';
            }

            // Skills
            if (config.card.showSkills && config.skills) {
                const skillsList = document.getElementById('skillsList');
                const maxSkills = config.card.maxSkills || 6;
                skillsList.innerHTML = config.skills.slice(0, maxSkills).map(skill => `
                    <span class="skill-tag">${skill}</span>
                `).join('');
            } else {
                document.getElementById('skillsSection').style.display = 'none';
            }

            // Last updated
            document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString();
        }

        function getSocialIcon(type) {
            const icons = {
                github: '⚙',
                linkedin: '💼',
                twitter: '🐦',
                orcid: '🔬',
                researchgate: '📚'
            };
            return icons[type] || '🔗';
        }

        function initializeButtons(config) {
            // Download VCF
            document.getElementById('downloadVCF').addEventListener('click', () => {
                const vcf = generateVCF(config);
                downloadVCF(vcf, `${config.personal.name.replace(/\s+/g, '_')}.vcf`);
            });

            // Disabled: Add to Wallet
            // document.getElementById('addToWallet').addEventListener('click', () => {
            //     addToAppleWallet(config);
            // });

            // Share
            document.getElementById('shareBtn').addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: config.personal.name,
                            text: `${config.personal.name} - ${config.personal.title}`,
                            url: window.location.href
                        });
                    } catch (err) {
                        console.log('Share cancelled');
                    }
                } else {
                    // Fallback: copy URL
                    navigator.clipboard.writeText(window.location.href);
                    alert('Link copied to clipboard!');
                }
            });
        }
    </script>
</body>
</html>
